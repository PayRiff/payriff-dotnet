name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid tag: $TAG"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check version matches tag
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Payriff/Payriff.csproj)
          if [ "v$version" != "$TAG" ]; then echo "Payriff.csproj version $version does not match tag $TAG"; exit 1; fi
      - run: dotnet test -c Release -p:PayriffTestTfm=net10.0
      - run: dotnet pack src/Payriff -c Release -o out
      - uses: NuGet/login@v1
        id: login
        with:
          user: payriff
      - run: dotnet nuget push out/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json